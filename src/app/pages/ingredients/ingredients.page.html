<ion-header>
</ion-header>

<ion-content [fullscreen]="true">
    
    <ion-list>
        @for (ingredient of loadedIngredients(); track ingredient.guid) {

            <ion-item>
                <p>{{ingredient.name}}</p>
            </ion-item>
        }
        
    </ion-list>

    <ion-fab slot="fixed" vertical="bottom" horizontal="end">
      <ion-fab-button id="open-modal">
          <ion-icon name="add"></ion-icon>
      </ion-fab-button>
    </ion-fab>

    <ion-modal #modal trigger="open-modal" [initialBreakpoint]="0.75" [breakpoints]="[0, 0.75, 1]" handleBehavior="cycle" [expandToScroll]="false">
      <ng-template>
        <ion-header>
          <ion-toolbar>
            <ion-buttons slot="start">
              <ion-button (click)="modal.dismiss()">Cancel</ion-button>
            </ion-buttons>
            <ion-title>Add a new ingredient</ion-title>
            <ion-buttons slot="end">
              <ion-button [strong]="true" (click)="saveNewIngredient(modal)">Add</ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>
        <ion-content class="ion-padding">

            <ion-grid>
                <ion-row>
                    <ion-col size="12">
                        <ion-input label="Name of the ingredient" label-placement="floating" fill="solid" [(ngModel)]="newIngredient.name"></ion-input>
                    </ion-col>
                    <ion-col size="6">
                        <ion-input type="number" label="Calories" label-placement="floating" fill="solid" [(ngModel)]="newIngredient.calories"></ion-input>
                    </ion-col>
                    <ion-col size="6">
                        <ion-input type="number" label="Protein (g)" label-placement="floating" fill="solid" [(ngModel)]="newIngredient.protein"></ion-input>
                    </ion-col>
                    <ion-col size="6">
                        <ion-input type="number" label="Carbs (g)" label-placement="floating" fill="solid" [(ngModel)]="newIngredient.carbs">
                        </ion-input>
                    </ion-col>
                    <ion-col size="6">
                        <ion-input type="number" label="Fats (g)" label-placement="floating" fill="solid" [(ngModel)]="newIngredient.fats"></ion-input>
                    </ion-col>
                    <ion-col size="6">
                        <ion-input type="number" label="Fiber (g)" label-placement="floating" fill="solid" [(ngModel)]="newIngredient.fiber"></ion-input>
                    </ion-col>
                    <ion-col size="6">
                        <ion-input type="number" label="Sugar (g)" label-placement="floating" fill="solid" [(ngModel)]="newIngredient.sugar"></ion-input>
                    </ion-col>
                </ion-row>
            </ion-grid>

        </ion-content>
      </ng-template>
    </ion-modal>

</ion-content>
