    <ion-modal #modal trigger="open-modal" [initialBreakpoint]="0.75" [breakpoints]="[0, 0.75, 1]" handleBehavior="cycle" [expandToScroll]="false">
      <ng-template>
        <ion-header>
          <ion-toolbar>
            <ion-buttons slot="start">
              <ion-button (click)="modal.dismiss()">Cancel</ion-button>
            </ion-buttons>
            <ion-title>Add a new ingredient</ion-title>
            <ion-buttons slot="end">
              <ion-button [strong]="true" (click)="modal.dismiss()">Add</ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>
        <ion-content class="ion-padding">
          <ion-item>
            <ion-input label="Enter your name" labelPlacement="stacked" type="text" placeholder="Your name"></ion-input>
          </ion-item>
        </ion-content>
      </ng-template>
    </ion-modal>

</ion-content>
