<ion-header>
</ion-header>

<ion-content [fullscreen]="true">

    <ion-fab slot="fixed" vertical="bottom" horizontal="end">
      <ion-fab-button id="open-modal">
          <ion-icon name="add"></ion-icon>
      </ion-fab-button>
    </ion-fab>

    <ion-modal #modal trigger="open-modal" [initialBreakpoint]="0.75" [breakpoints]="[0, 0.75, 1]" handleBehavior="cycle" [expandToScroll]="false">
      <ng-template>
        <ion-header>
          <ion-toolbar>
            <ion-buttons slot="start">
              <ion-button (click)="modal.dismiss()">Cancel</ion-button>
            </ion-buttons>
            <ion-title>Add a new ingredient</ion-title>
            <ion-buttons slot="end">
              <ion-button [strong]="true" (click)="modal.dismiss()">Add</ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>
        <ion-content class="ion-padding">

            <ion-grid>
                <ion-row>
                    <ion-col size="12">
                        <ion-input label-placement="fixed" fill="solid" placeholder="Name of the ingredient" ngModel></ion-input>
                    </ion-col>
                    <ion-col size="6">
                        <ion-input label="Solid input" label-placement="floating" fill="solid" placeholder="Enter text"></ion-input>
                    </ion-col>
                    <ion-col size="6">
                        <ion-input label="Solid input" label-placement="floating" fill="solid" placeholder="Enter text"></ion-input>
                    </ion-col>
                </ion-row>
            </ion-grid>

        </ion-content>
      </ng-template>
    </ion-modal>

</ion-content>
